<!-- @dsCard group="Brand" viewport="700x270" name="Fonds photographiques" subtitle="Toujours sous voile : le texte reste sur zone sombre" -->
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin:0; padding:18px 20px; background:var(--bg-base); font-family:var(--font-ui); color:var(--ink); }
  
  .hero { position:relative; overflow:hidden; border-radius:var(--r-3xl); border:1px solid var(--border); background-image:var(--photo-veil-hero), url("../assets/swimmer.jpg"); background-size:cover; background-position:right center; padding:20px 22px; min-height:120px; display:flex; flex-direction:column; justify-content:flex-end; }
  .k { font:var(--label); letter-spacing:0.2em; text-transform:uppercase; color:var(--cyan-soft); }
  .h { margin:7px 0 0; font:var(--display-1); letter-spacing:var(--track-display); text-transform:uppercase; }
  .p { margin:8px 0 0; max-width:360px; font:var(--body); color:var(--ink-on-photo); }
  .bar { margin-top:12px; border-radius:var(--r-l); border:1px solid var(--border); background-image:var(--photo-veil-bar), url("../assets/water-texture.jpg"); background-size:cover; padding:12px 14px; font:var(--body-s); color:var(--ink-2); }

</style>
</head>
<body>

  <div class="hero">
    <span class="k">Saison 2025 / 2026</span>
    <h3 class="h">Le club en un coup d’œil</h3>
    <p class="p">Le corps de texte ne dépasse jamais 360 px : il reste dans la zone à ≥ 0,8 d'opacité du voile.</p>
  </div>
  <div class="bar">--photo-veil-bar · texture d'eau sous un voile presque opaque, pour les barres et en-têtes</div>
</body>
</html>
