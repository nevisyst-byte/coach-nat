<!-- @dsCard group="Colors" viewport="700x150" name="Couleurs sémantiques" subtitle="Encre pleine + fond voilé, par état" -->
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin:0; padding:18px 20px; background:var(--bg-base); font-family:var(--font-ui); color:var(--ink); }
  
  .grid { display:grid; grid-template-columns:repeat(5,1fr); gap:10px; }
  .cell { border-radius:var(--r-l); padding:12px; border:1px solid var(--border); }
  .b { font-size:11px; font-weight:700; letter-spacing:var(--track-label); text-transform:uppercase; padding:5px 9px; border-radius:var(--r-xs); display:inline-block; }
  .n { font:var(--label-xs); color:var(--ink-3); margin-top:9px; display:block; }

</style>
</head>
<body>

  <div class="grid">
    <div class="cell"><span class="b" style="background:var(--ok-bg); color:var(--ok)">Assuré</span><span class="n">ok · #2ECC8F</span></div>
    <div class="cell"><span class="b" style="background:var(--warn-bg); color:var(--warn)">Remplacé</span><span class="n">warn · #F2B33D</span></div>
    <div class="cell"><span class="b" style="background:var(--danger-bg); color:var(--danger)">À couvrir</span><span class="n">danger · #E8442B</span></div>
    <div class="cell"><span class="b" style="background:var(--info-bg); color:var(--blue-ink)">National</span><span class="n">info · #8CC4FF</span></div>
    <div class="cell"><span class="b" style="background:var(--neutral-bg); color:var(--ink-2)">Sans perf</span><span class="n">neutral · #A9BBD4</span></div>
  </div>
</body>
</html>
