<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin:0; padding:18px 20px; background:var(--bg-base); font-family:var(--font-ui); color:var(--ink); }
  
  .l { font:var(--label-xs); letter-spacing:var(--track-label); text-transform:uppercase; color:var(--ink-faint); }
  .s { margin:2px 0 11px; }

</style>
</head>
<body>

  <span class="l">body-l · 15/500</span>
  <div class="s" style="font:var(--body-l)">Compétition Élite — 9 nageurs</div>
  <span class="l">body · 14/400</span>
  <div class="s" style="font:var(--body); color:var(--ink-2)">312 licenciés, 6 coachs, 38 créneaux hebdomadaires.</div>
  <span class="l">body-s · 13/400</span>
  <div class="s" style="font:var(--body-s); color:var(--ink-3)">Marie Lefort · vue personnelle</div>
  <span class="l">body-xs · 12/400</span>
  <div class="s" style="font:var(--body-xs); color:var(--ink-3)">18:00–20:00 · 14 nageurs · Bassin 50 m</div>
  <span class="l">label · 11/600 · 0.12em — toujours en capitales</span>
  <div class="s" style="font:var(--label); letter-spacing:var(--track-label); text-transform:uppercase; color:var(--ink-faint)">Thématique dominante</div>
</body>
</html>
