<!-- @dsCard group="Components" viewport="700x340" name="Motifs d'écran" subtitle="Carte de section, créneau, ligne de personne, état vide" -->
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<style>
  body { margin:0; padding:20px; background:var(--bg-base); font-family:var(--font-ui); color:var(--ink); }
  .cols { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  .card { background:var(--bg-card); border:1px solid var(--border); border-radius:var(--r-2xl); padding:16px; }
  .h2 { margin:0 0 12px; font:var(--display-4); letter-spacing:var(--track-title); text-transform:uppercase; }
  .slot { background:var(--bg-card); border:1px solid var(--border); border-left:var(--accent-bar) solid var(--danger); border-radius:var(--r-l); padding:14px; }
  .state { display:flex; align-items:center; gap:8px; font:var(--label-xs); letter-spacing:0.1em; text-transform:uppercase; color:var(--danger); }
  .dot { width:7px; height:7px; border-radius:50%; background:var(--danger); }
  .grp { margin-top:10px; font:var(--body-l); font-weight:600; }
  .coach { margin-top:3px; font:var(--body-s); }
  .facts { margin-top:11px; padding-top:10px; border-top:1px solid rgba(255,255,255,0.07); font:var(--label); font-weight:400; color:var(--ink-4); }
  .row { display:flex; align-items:center; gap:12px; padding:11px 13px; border-radius:var(--r-l); background:var(--veil-1); border:1px solid var(--border); margin-bottom:9px; }
  .ava { width:34px; height:34px; border-radius:var(--r-s); background:rgba(232,68,43,0.22); display:flex; align-items:center; justify-content:center; font:var(--label); font-weight:700; }
  .empty { border:1px dashed var(--border-strong); border-radius:var(--r-l); padding:22px; text-align:center; }
  .badge { font-size:11px; font-weight:700; letter-spacing:var(--track-label); text-transform:uppercase; padding:5px 10px; border-radius:var(--r-xs); background:var(--danger-bg); color:var(--danger); }
</style>
</head>
<body>
  <div class="cols">
    <div>
      <div class="slot">
        <div class="state"><span class="dot"></span>À couvrir</div>
        <div class="grp">Sauvetage sportif</div>
        <div class="coach">Léa Morel</div>
        <div class="facts">18:00–19:00 · 8 nageurs · Bassin 25 m</div>
      </div>
      <div class="empty" style="margin-top:16px;">
        <div style="font:var(--display-3); letter-spacing:0.04em; text-transform:uppercase; color:var(--ink-2);">Aucun créneau</div>
        <div style="font:var(--body-s); color:var(--ink-3); margin-top:6px;">Ajoute un créneau à ce jour de stage.</div>
      </div>
    </div>
    <div class="card">
      <h2 class="h2">Absences nageurs</h2>
      <div class="row">
        <div class="ava">AR</div>
        <div style="flex:1"><div style="font:var(--body-strong)">Antoine Rey</div><div style="font:var(--label); font-weight:400; color:var(--ink-3)">26 mai · non déclarée</div></div>
        <span class="badge">À traiter</span>
      </div>
      <div class="row">
        <div class="ava" style="background:rgba(30,123,255,0.22)">NC</div>
        <div style="flex:1"><div style="font:var(--body-strong)">Nathalie Cord</div><div style="font:var(--label); font-weight:400; color:var(--ink-3)">03 juin · maladie</div></div>
        <span class="badge" style="background:var(--ok-bg); color:var(--ok)">Validée</span>
      </div>
    </div>
  </div>
</body>
</html>
