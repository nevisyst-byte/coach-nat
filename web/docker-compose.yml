services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: coachnat
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-coachnat}
      POSTGRES_DB: coachnat
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coachnat -d coachnat"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://coachnat:${POSTGRES_PASSWORD:-coachnat}@db:5432/coachnat?schema=public
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET must be set in .env}
      NODE_ENV: production
    ports:
      - "${APP_PORT:-3010}:3000"
    # Si ton reverse proxy (ex. Nginx Proxy Manager) tourne dans Docker et doit
    # atteindre ce conteneur par nom plutôt que par port hôte, décommente et
    # adapte au nom du réseau externe de ton reverse proxy :
    # networks:
    #   - default
    #   - proxy
    #
    # networks:
    #   proxy:
    #     external: true

volumes:
  db_data:
