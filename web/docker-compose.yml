services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: coachnat
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-coachnat}
      POSTGRES_DB: coachnat
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coachnat -d coachnat"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://coachnat:${POSTGRES_PASSWORD:-coachnat}@db:5432/coachnat?schema=public
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET must be set in .env}
      NODE_ENV: production
    # Pas de port publié sur l'hôte : le conteneur "cloudflared" ci-dessous
    # atteint l'app directement via le réseau Docker interne (http://app:3000).
    # Décommente si tu veux aussi y accéder en local pour déboguer :
    # ports:
    #   - "127.0.0.1:3010:3000"

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?CLOUDFLARE_TUNNEL_TOKEN must be set in .env}
    depends_on:
      - app

volumes:
  db_data:
