services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: coachnat
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env.production}
      POSTGRES_DB: coachnat
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coachnat -d coachnat"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://coachnat:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env.production}@db:5432/coachnat?schema=public
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET must be set in .env}
      NODE_ENV: production
      # Mailing (mot de passe oublié, notifications) — voir DEPLOY.md § Mailing.
      # RESEND_API_KEY vide = les mails sont simplement journalisés, pas envoyés.
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-COACH-NAT <onboarding@resend.dev>}
      APP_URL: ${APP_URL:-https://coach-nat.nevi-syst.com}
      CRON_SECRET: ${CRON_SECRET:-}
    ports:
      # Publié sur l'hôte pour que le tunnel Cloudflare existant (qui route
      # via l'IP de la passerelle Docker, comme pour immo/n8n/etc.) puisse
      # l'atteindre. Garde ce port cohérent avec l'entrée "Public Hostname"
      # coach-nat.nevi-syst.com côté dashboard Cloudflare.
      - "${APP_PORT:-3010}:3000"

volumes:
  db_data:
